name: apply-reviewed

on:
  push:
    branches: [main]
    paths:
      - reviewed_identifications.py
      - .github/workflows/apply-reviewed.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Conferir sem gravar na planilha
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: youtube-tracker-sheet-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validar catalogo e preservacao de nomes existentes
        run: python -m unittest discover -s tests -p test_reviewed.py
      - name: Aplicar identificações revisadas
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python apply_reviewed.py --dry-run
          else
            python apply_reviewed.py
          fi
