name: investigate-one-video

on:
  workflow_dispatch:
    inputs:
      video:
        description: ID ou URL (vazio = mais recente sem obra nos últimos 7 dias)
        required: false
        type: string

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-investigate.txt
      - name: Coletar evidências sem editar a planilha
        env:
          VIDEO: ${{ inputs.video }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$VIDEO" ]; then
            node investigate.js --video "$VIDEO" --out artifacts/investigation
          else
            node investigate.js --first-missing --out artifacts/investigation
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: investigation
          path: artifacts/investigation/
          retention-days: 7
