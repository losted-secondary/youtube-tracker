name: sync

on:
  schedule:
    # 2 tentativas/hora. O repo que roda de verdade e o PRIVADO (lsfelipedev), que
    # tem teto de 2.000 min/mes: 48 rodadas/dia dao ~1.440 min. De 10 em 10 min
    # (144/dia) estouraria. So da pra apertar pra 10 min em repo publico.
    # A do :17 faz a varredura completa de viewers (FULL_SWEEP_BEFORE_MINUTE=20).
    - cron: "17,47 * * * *"
  workflow_dispatch:
  # commit tocando este arquivo re-arma o agendamento quando o GitHub
  # para de disparar o cron (acontece depois de disable/enable, e em repo novo).

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
