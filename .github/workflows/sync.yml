name: sync

on:
  schedule:
    # 6 tentativas/hora em minutos quebrados (o GitHub dropa mais no :00).
    # A rodada do :03 e a unica com minuto < 10, entao e ela que faz a varredura
    # completa de viewers; as outras 5 so mexem nos videos recentes (cota da YouTube).
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
