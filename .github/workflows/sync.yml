name: sync

on:
  schedule:
    # 2 tentativas/hora em minutos quebrados (o GitHub dropa mais no :00).
    # o sync ja atualiza os viewers de todos, entao nao ha job separado.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
