name: sync

on:
  # SEM cron: o agendamento do GitHub dropa quase tudo (2 rodadas de 48 em 28/08/2026).
  # Quem manda a hora agora e um gatilho de 10 min no Apps Script do Google, que chama
  # este workflow_dispatch. Deixar o cron aqui tambem so criaria rodada duplicada.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
